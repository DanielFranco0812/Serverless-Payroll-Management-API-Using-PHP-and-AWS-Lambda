org: francodanieljehd
service: php-payroll-api

provider:
  name: aws
  runtime: php-82-fpm
  region: ap-southeast-1
  environment:
    S3_BUCKET: payroll-franco
    S3_REGION: ap-southeast-1
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::payroll-franco/payslips/*

package:
  patterns:
    - public/**
    - data/*.csv
    - vendor/**

plugins:
  - ./vendor/bref/bref

functions:
  api:
    handler: public/index.php
    description: 'Serverless PHP Payroll API'
    events:
      - httpApi: '*'